name: Deploy to AWS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_name:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      ecs_cluster:
        required: true
        type: string
      ecs_service:
        required: true
        type: string
      ecr_repository:
        required: false
        type: string
        default: ""
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true

jobs:
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp

      - name: Load Image
        run: docker load --input /tmp/${{ inputs.image_name }}.tar

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: ECR Login
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR Repository
        id: repository
        env:
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          if [ -n "$ECR_REPOSITORY" ]; then
            echo "repository=$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          else
            echo "repository=$ECR_REGISTRY/$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Push Image
        env:
          ECR_REPOSITORY: ${{ steps.repository.outputs.repository }}
        run: |
          docker tag ${{ inputs.image_name }}:${{ github.sha }} $ECR_REPOSITORY:${{ github.sha }}
          docker tag ${{ inputs.image_name }}:${{ github.sha }} $ECR_REPOSITORY:latest
          docker push $ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REPOSITORY:latest

      - name: Deploy ECS
        run: |
          aws ecs update-service \
            --cluster ${{ inputs.ecs_cluster }} \
            --service ${{ inputs.ecs_service }} \
            --force-new-deployment

      - name: Wait for Stable
        run: |
          aws ecs wait services-stable \
            --cluster ${{ inputs.ecs_cluster }} \
            --services ${{ inputs.ecs_service }}

      - name: Health Check
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --cluster ${{ inputs.ecs_cluster }} \
            --service-name ${{ inputs.ecs_service }} \
            --query 'taskArns[0]' --output text)

          if [ "$TASK_ARN" != "None" ] && [ -n "$TASK_ARN" ]; then
            ENI_ID=$(aws ecs describe-tasks \
              --cluster ${{ inputs.ecs_cluster }} \
              --tasks $TASK_ARN \
              --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' \
              --output text)
            PUBLIC_IP=$(aws ec2 describe-network-interfaces \
              --network-interface-ids $ENI_ID \
              --query 'NetworkInterfaces[0].Association.PublicIp' \
              --output text)
            curl -f --retry 5 --retry-delay 10 http://$PUBLIC_IP:8000/health
          fi

      - name: Summary
        env:
          ECR_REPOSITORY: ${{ steps.repository.outputs.repository }}
        run: |
          echo "### Deployed to AWS" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** ${{ inputs.ecs_cluster }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ inputs.ecs_service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** $ECR_REPOSITORY:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
