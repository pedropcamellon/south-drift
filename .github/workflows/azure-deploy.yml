name: Deploy to Azure

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_name:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      container_app_name:
        required: true
        type: string
      resource_group:
        required: true
        type: string
      acr_name:
        required: true
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true

jobs:
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Download Image
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp

      - name: Load Image
        run: docker load --input /tmp/${{ inputs.image_name }}.tar

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR Login
        run: az acr login --name ${{ inputs.acr_name }}

      - name: Push Image
        run: |
          ACR_URL="${{ inputs.acr_name }}.azurecr.io"
          docker tag ${{ inputs.image_name }}:${{ github.sha }} $ACR_URL/${{ inputs.image_name }}:${{ github.sha }}
          docker tag ${{ inputs.image_name }}:${{ github.sha }} $ACR_URL/${{ inputs.image_name }}:latest
          docker push $ACR_URL/${{ inputs.image_name }}:${{ github.sha }}
          docker push $ACR_URL/${{ inputs.image_name }}:latest

      - name: Deploy Container App
        run: |
          az containerapp update \
            --name ${{ inputs.container_app_name }} \
            --resource-group ${{ inputs.resource_group }} \
            --image ${{ inputs.acr_name }}.azurecr.io/${{ inputs.image_name }}:${{ github.sha }}

      - name: Health Check
        run: |
          sleep 30
          APP_URL=$(az containerapp show \
            --name ${{ inputs.container_app_name }} \
            --resource-group ${{ inputs.resource_group }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -f --retry 5 --retry-delay 10 https://$APP_URL/health

      - name: Summary
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ inputs.container_app_name }} \
            --resource-group ${{ inputs.resource_group }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Deployed to Azure" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** https://$APP_URL" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ inputs.acr_name }}.azurecr.io/${{ inputs.image_name }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
