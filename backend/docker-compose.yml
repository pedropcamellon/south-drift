services:
  folium-backend:
    image: folium-backend
    pull_policy: build
    container_name: folium-backend
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: development
    ports:
      - "8000:8000"
    depends_on:
      folium-postgres:
        condition: service_healthy
      folium-minio:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
      RELOAD: "true"
      DATABASE_URL: postgresql+asyncpg://folium:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}@folium-postgres:5432/folium_db
      STORAGE_ENDPOINT: ${BACKEND_STORAGE_ENDPOINT:-http://folium-minio:9000}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-folium-dev}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      TRANSCRIPTION_SERVICE_URL: ${TRANSCRIPTION_SERVICE_URL:-http://folium-transcribe:8001}
      SUMMARIZATION_SERVICE_URL: ${SUMMARIZATION_SERVICE_URL:-http://folium-summarize:8002}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-folium-temporal:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
      CHARTREVIEW_INTERNAL_TOKEN: ${CHARTREVIEW_INTERNAL_TOKEN:?Set CHARTREVIEW_INTERNAL_TOKEN in root .env}
    volumes:
      - backend_cache:/root/.cache
    working_dir: /workspace/backend
    command:
      [
        "/bin/sh",
        "-c",
        "uv run --frozen --no-sync --package folium alembic upgrade head && exec uv run --frozen --no-sync --package folium uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    develop:
      watch:
        - action: sync
          path: ./app
          target: /workspace/backend/app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
        - action: rebuild
          path: ./pyproject.toml
        - action: sync
          path: ../packages/folium-core/src
          target: /workspace/packages/folium-core/src
          ignore:
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ../packages/folium-core/pyproject.toml

volumes:
  backend_cache:
