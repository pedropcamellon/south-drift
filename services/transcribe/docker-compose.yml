services:
  # Self-hosted Whisper (HIPAA compliant, default)
  folium-transcribe:
    build:
      context: ../..
      dockerfile: services/transcribe/Dockerfile
      target: development
      args:
        PROVIDER: whisper # Change to: aws, azure
    env_file:
      - path: ../../.env
        required: false
      - path: .env
        required: false
    ports:
      - "8001:8001"
    environment:
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-whisper}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      PORT: "8001"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HF_HOME: /workspace/services/transcribe/.cache/huggingface
    volumes:
      # Optional: Persist models outside container (for model updates without rebuild)
      - whisper-models:/workspace/services/transcribe/.cache/huggingface
    # Network will be overridden by parent docker-compose.yml
    command: uv run --frozen --no-sync --package transcribe uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    develop:
      watch:
        - action: sync
          path: ./app
          target: /workspace/services/transcribe/app
          ignore:
            - __pycache__/
            - "*.pyc"
            - .pytest_cache/
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8001/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  whisper-models:
    driver: local
